<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>IoTカレンダー</title>
    <meta name="description" content="IoTカレンダーは、センサやモニター等のデバイスと連携して予定をお知らせするカレンダーアプリです。">

    <!--スマホ表示に対応するため、スマホのデバイス幅・初期の拡大率1.0倍を指定-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!--stylesheetでCSS適用-->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
<h1>IoTカレンダー</h1>

<!--ログアウトボタン（HTMLだけでform送信）-->
<form action="/logout" method="POST">
    <button type="submit">ログアウト</button>
</form>

<hr>

<h2>カレンダーに予定を追加</h2>

<!--JavaScriptでDBに予定を追加するためにinputにidの指定・labelで名前を付ける-->
<label>予定の名前：</label>
<input type="text" id="schedule_title"><br><br>

<label>日時：</label>
<input type="datetime-local" id="schedule_datetime"><br><br>

<!--予定追加ボタン(JavaScriptで操作するためのid指定)-->
<button type="button" id="add_button">予定追加</button>

<hr>

<h2>予定一覧</h2>

<!--JavaScriptで予定を表示するためのulリスト・id指定-->
<pre>
<ul id="event_list">
</ul>
</pre>    

<hr>

<h2>予定の削除 </h2>
<!--JavaScriptでDBに予定を削除するためにinputにidの指定・labelで名前を付ける-->
<label for="delete_id">削除する予定ID：</label>
<input type="number" id="delete_id"><br><br>
<button type="button" id="delete_button">予定削除</button>

<!--JavaScriptファイルの読み込み-->
<script src="{{ url_for('static', filename='index.js') }}"></script>

</body>
</html>
